[package]
name = "spawn-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spawnbox HTTP API for a single Linux KVM host"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spawn-egress = { path = "../spawn-egress" }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
nix = { version = "0.31.3", features = ["fs", "user"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring", "fs"] }
opentelemetry = { version = "0.33.1", features = ["logs", "trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["logs", "trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", features = ["logs", "trace"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
spawn-node = { path = "../spawn-node" }
spawn-proto = { path = "../spawn-proto" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1.19"
tonic = "0.14.9"
tower = { version = "0.5.3", features = ["util"] }
zstd = "0.13.4"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["logs", "trace", "testing"] }
