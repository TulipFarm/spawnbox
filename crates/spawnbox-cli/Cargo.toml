[package]
name = "spawnbox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tools for the self-hosted Spawnbox sandbox fleet"
publish = false

[[bin]]
name = "spawnbox"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "query", "http2"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "__rustls-tls"] }
url = "2.5.8"
