[package]
name = "spawn-egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spawnbox egress proxy: network policy and secret injection for sandboxes"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
http = "1.5.0"
httparse = "1.10.1"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
nix = { version = "0.31.3", features = ["socket", "net"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.11"
