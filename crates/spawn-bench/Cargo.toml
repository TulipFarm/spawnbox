[package]
name = "spawn-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Benchmarks and checks for Spawnbox on a Linux KVM host"
publish = false

[dependencies]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["user"] }
serde_json = "1.0.154"
spawn-node = { path = "../spawn-node" }
spawn-proto = { path = "../spawn-proto" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.9"
