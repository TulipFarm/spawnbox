name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint guest agent (static Linux build)
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update -q && sudo apt-get install -yq musl-tools
          cargo clippy -p spawn-guest --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  postgres:
    name: Postgres and backups
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spawnbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPAWNBOX_TEST_DATABASE_URL: postgres://postgres:spawnbox@localhost:5432/postgres
      SPAWNBOX_TEST_BACKUP: "1"
      SPAWNBOX_TEST_API_BIN: ${{ github.workspace }}/target/debug/spawn-api
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install backup tools
        run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16 gnupg sqlite3
      - name: Build
        run: cargo build -p spawn-api --locked
      - name: Test against Postgres, with a backup and restore
        run: cargo test -p spawn-api --locked
