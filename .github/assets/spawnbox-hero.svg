  <text class="h" x="68" y="170">Sandboxes for AI agents,</text>
  <text class="h hl" x="68" y="240">on your own servers.</text>
  <text class="p" x="72" y="292">Each agent gets its own small, safe computer. Ready in</text>
  <text class="p" x="72" y="320">less than 100 ms. Your API keys never go inside.</text>
  <rect class="term" x="72" y="358" width="560" height="52" rx="4"/>
  <text class="cmd" x="92" y="390"><tspan class="hl">$</tspan> spawnbox exec $S -- python3 main.py</text>
